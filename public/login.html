<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Munich Flavour Onboarding – Login</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MF Onboarding">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/logo.jpg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="logo-wrap">
      <img src="/assets/logo.jpg" alt="Munich Flavour" onerror="this.style.display='none'">
    </div>
    <h2>Munich Flavour<br>Onboarding</h2>

    <div id="error" class="alert alert-error hidden"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Benutzername</label>
        <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" required>
      </div>
      <div class="form-group">
        <label for="password">Passwort</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Anmelden</button>
    </form>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
