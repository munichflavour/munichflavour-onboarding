<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MF Portal</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/logo.jpg">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .search-bar {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 14px;
      margin-bottom: 20px;
    }
    .search-bar input {
      border: none;
      box-shadow: none;
      padding: 14px 10px;
      font-size: 16px;
      flex: 1;
      background: transparent;
    }
    .search-bar input:focus { border: none; outline: none; }
    .search-icon { font-size: 18px; color: var(--text-tertiary); flex-shrink: 0; }
    .search-clear { font-size: 18px; color: var(--text-tertiary); cursor: pointer; flex-shrink: 0; padding: 4px; }

    .folder-list { margin-bottom: 8px; }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .breadcrumb-back {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      min-height: 44px;
    }
    .breadcrumb-back:active { background: var(--surface-2); }
    .breadcrumb-title { font-size: 18px; font-weight: 700; flex: 1; }

    /* Dokumentliste: nutzt .list-row/.icon-badge-Basis aus style.css, damit Ordner und
       Dateien optisch konsistent sind (Icon-Badge | Text | Aktion). */
    .file-list { margin-bottom: 20px; }
    .file-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      -webkit-tap-highlight-color: transparent;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s;
    }
    .file-item:last-child { margin-bottom: 0; }
    .file-item:active, .file-item:hover { background: var(--surface-2); }
    .file-type-icon {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--surface-2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .file-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .file-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-meta { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }
    .file-desc { font-size: 12px; color: var(--text-secondary); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-tertiary); }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }

    .section-label {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--text-secondary);
      margin: 20px 0 10px;
    }
    .header-title,.search-bar input {min-width:0;}
    @media(max-width:380px){header{gap:8px;padding:10px}.logout-btn{padding:8px!important}}
  </style>
</head>
<body>
  <header>
    <img src="/assets/logo.jpg" alt="Munich Flavour" onerror="this.style.display='none'">
    <div class="header-title">
      <h1>MF Portal</h1>
      <div class="header-sub" id="headerSub">Mitarbeiterportal</div>
    </div>
    <button id="pushBtn" onclick="togglePush()" style="background:none;border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:20px;padding:6px 10px;cursor:pointer;margin-right:6px;display:none;" title="Benachrichtigungen">🔔</button>
    <button class="logout-btn" onclick="logout()">Abmelden</button>
  </header>

  <main>
    <div id="offlineBanner" class="offline-banner hidden">📡 Offline – zuvor angesehene Inhalte sind verfügbar.</div>

    <div id="pushReminderBanner" class="push-reminder-banner hidden">
      <div class="push-reminder-text">
        🔔 Verpasse nichts:
        <div class="push-reminder-list">✓ Neue Dokumente &nbsp; ✓ Ankündigungen &nbsp; ✓ Überstunden-Updates</div>
      </div>
      <button class="push-reminder-enable" onclick="enablePushFromBanner()">Aktivieren</button>
      <button class="push-reminder-dismiss" onclick="dismissPushBanner()" title="Schließen">✕</button>
    </div>

    <div id="visitSummary" class="visit-summary hidden"></div>

    <!-- Überstundenkonto -->
    <div id="overtimeCard" class="card hidden" style="padding:16px;margin-bottom:20px;">
      <div class="section-title" style="margin:0;">⏱ Überstundenkonto</div>
      <div style="font-size:28px;font-weight:700;margin-top:2px;" id="overtimeValue">–</div>
      <div style="font-size:12px;color:var(--text-tertiary);margin-top:2px;" id="overtimeDate"></div>
      <button id="overtimeHistoryToggle" class="overtime-history-toggle hidden" onclick="toggleOvertimeHistory()">Verlauf anzeigen</button>
      <div id="overtimeHistoryList" class="overtime-history-list hidden"></div>
    </div>

    <!-- Ankündigungen -->
    <div id="announcementsSection" class="hidden" style="margin-bottom:20px;">
      <div class="section-label">Ankündigungen</div>
      <div id="announcementsList"></div>
      <button id="announcementsMore" class="announcement-more hidden" onclick="toggleAnnouncements()"></button>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="search" id="searchInput" placeholder="Dokument suchen…" oninput="onSearch(this.value)" autocomplete="off">
      <span class="search-clear hidden" id="searchClear" onclick="clearSearch()">✕</span>
    </div>

    <!-- Root / Folder view -->
    <div id="browserView">
      <div id="breadcrumbRow" class="hidden" style="align-items:center;gap:10px;margin-bottom:16px;display:flex;">
        <button class="breadcrumb-back" onclick="navigateBack()">← Zurück</button>
        <div class="breadcrumb-title" id="folderTitle"></div>
      </div>

      <div id="subFolders"></div>
      <div id="fileSection">
        <div class="file-list" id="fileList">
          <div style="padding:32px;text-align:center;"><span class="spinner"></span></div>
        </div>
      </div>
    </div>

    <!-- Search results -->
    <div id="searchView" class="hidden">
      <div class="section-label" id="searchLabel">Suchergebnisse</div>
      <div class="file-list" id="searchResults"></div>
    </div>
  </main>

  <script src="/js/employee.js"></script>
</body>
</html>
