<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MF Portal</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/logo.jpg">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .search-bar {
      display: flex;
      align-items: center;
      background: var(--white);
      border: 1.5px solid var(--gray-mid);
      border-radius: 12px;
      padding: 0 14px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    .search-bar input {
      border: none;
      box-shadow: none;
      padding: 14px 10px;
      font-size: 16px;
      flex: 1;
      background: transparent;
    }
    .search-bar input:focus { border: none; outline: none; }
    .search-icon { font-size: 18px; color: #aaa; flex-shrink: 0; }
    .search-clear { font-size: 18px; color: #aaa; cursor: pointer; flex-shrink: 0; padding: 4px; }

    .folder-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    @media (min-width: 500px) { .folder-grid { grid-template-columns: repeat(3, 1fr); } }

    .folder-card {
      position: relative;
      background: var(--white);
      border-radius: 12px;
      padding: 20px 16px 16px;
      box-shadow: var(--shadow);
      cursor: pointer;
      border: 1.5px solid var(--gray-mid);
      transition: border-color 0.15s, box-shadow 0.15s;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .folder-card:active { border-color: #000; box-shadow: 0 4px 16px rgba(0,0,0,0.18); }
    .folder-card .folder-emoji { font-size: 32px; }
    .folder-card .folder-name { font-size: 14px; font-weight: 700; line-height: 1.3; }
    .folder-card .folder-count { font-size: 12px; color: var(--gray-dark); }
    .folder-card .new-dot {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #cc0000;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .breadcrumb-back {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 700;
      color: #000;
      cursor: pointer;
      background: var(--white);
      border: 1.5px solid var(--gray-mid);
      border-radius: 8px;
      padding: 8px 14px;
      min-height: 44px;
    }
    .breadcrumb-back:active { background: var(--gray-light); }
    .breadcrumb-title { font-size: 18px; font-weight: 700; flex: 1; }

    /* Dokumentliste: gleiche feste Zeilenstruktur wie im Admin-Bereich (Icon | Text |
       Ansehen), damit jede Zeile unabhängig von Dateiname/Beschreibung gleich aussieht.
       Text wird per Ellipsis gekürzt statt umzubrechen. */
    .file-list { background: var(--white); border-radius: 12px; box-shadow: var(--shadow); padding: 12px; margin-bottom: 20px; }
    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--white);
      border: 1px solid var(--gray-mid);
      border-radius: 8px;
      margin-bottom: 6px;
      -webkit-tap-highlight-color: transparent;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .file-item:last-child { margin-bottom: 0; }
    .file-item:active { background: var(--gray-light); }
    .file-type-icon { font-size: 20px; flex-shrink: 0; }
    .file-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .file-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-meta { font-size: 11px; color: #aaa; margin-top: 1px; }
    .file-desc { font-size: 12px; color: #888; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .file-btn {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      -webkit-tap-highlight-color: transparent;
    }
    .file-btn-view { background: #000; color: #fff; }
    .file-btn:active { opacity: 0.7; }

    .empty-state { text-align: center; padding: 40px 20px; color: #aaa; }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }

    .section-label {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--gray-dark);
      margin: 20px 0 10px;
    }
    .header-title,.search-bar input {min-width:0;}
    @media(max-width:380px){header{gap:8px;padding:10px}.logout-btn{padding:8px!important}}
  </style>
</head>
<body>
  <header>
    <img src="/assets/logo.jpg" alt="Munich Flavour" onerror="this.style.display='none'">
    <div class="header-title">
      <h1>MF Portal</h1>
      <div class="header-sub" id="headerSub">Mitarbeiterportal</div>
    </div>
    <button id="pushBtn" onclick="togglePush()" style="background:none;border:1.5px solid rgba(255,255,255,0.3);border-radius:8px;color:#fff;font-size:20px;padding:6px 10px;cursor:pointer;margin-right:6px;display:none;" title="Benachrichtigungen">🔔</button>
    <button class="logout-btn" onclick="logout()">Abmelden</button>
  </header>

  <main>
    <div id="offlineBanner" class="offline-banner hidden">📡 Offline – zuvor angesehene Inhalte sind verfügbar.</div>

    <!-- Ankündigungen -->
    <div id="announcementsSection" class="hidden" style="margin-bottom:20px;">
      <div class="section-label">Ankündigungen</div>
      <div id="announcementsList"></div>
      <button id="announcementsMore" class="announcement-more hidden" onclick="toggleAnnouncements()"></button>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="search" id="searchInput" placeholder="Dokument suchen…" oninput="onSearch(this.value)" autocomplete="off">
      <span class="search-clear hidden" id="searchClear" onclick="clearSearch()">✕</span>
    </div>

    <!-- Root / Folder view -->
    <div id="browserView">
      <div id="breadcrumbRow" class="hidden" style="align-items:center;gap:10px;margin-bottom:16px;display:flex;">
        <button class="breadcrumb-back" onclick="navigateBack()">← Zurück</button>
        <div class="breadcrumb-title" id="folderTitle"></div>
      </div>

      <div id="subFolders"></div>
      <div id="fileSection">
        <div class="file-list" id="fileList">
          <div style="padding:32px;text-align:center;"><span class="spinner" style="border-color:rgba(0,0,0,0.2);border-top-color:#000;"></span></div>
        </div>
      </div>
    </div>

    <!-- Search results -->
    <div id="searchView" class="hidden">
      <div class="section-label" id="searchLabel">Suchergebnisse</div>
      <div class="file-list" id="searchResults"></div>
    </div>
  </main>

  <script src="/js/employee.js"></script>
</body>
</html>
