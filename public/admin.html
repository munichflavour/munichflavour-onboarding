<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Munich Flavour – Admin</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MF Onboarding">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/logo.jpg">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .folder-tree { margin-bottom: 8px; }
    .folder-node { margin-bottom: 4px; }
    .folder-header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; background: var(--white);
      border: 1.5px solid var(--gray-mid); border-radius: 8px;
      cursor: pointer; transition: background 0.15s;
    }
    .folder-header:hover { background: var(--gray-light); }
    .folder-icon { font-size: 18px; flex-shrink: 0; }
    .folder-name { flex: 1; font-weight: 600; font-size: 15px; }
    .folder-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .folder-children { margin-left: 24px; margin-top: 4px; }
    .doc-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: var(--gray-light);
      border-radius: 6px; margin-bottom: 4px;
    }
    .doc-icon { font-size: 16px; flex-shrink: 0; }
    .doc-name { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-date { font-size: 12px; color: var(--gray-dark); flex-shrink: 0; }
    .upload-zone {
      border: 2px dashed var(--gray-mid); border-radius: 8px;
      padding: 24px; text-align: center; cursor: pointer;
      transition: border-color 0.2s; margin-top: 12px;
    }
    .upload-zone:hover, .upload-zone.dragover { border-color: var(--black); }
    .upload-zone p { color: var(--gray-dark); font-size: 14px; margin-top: 8px; }
    .root-docs { margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <img src="/assets/logo.jpg" alt="Munich Flavour" onerror="this.style.display='none'">
    <div class="header-title">
      <h1>Admin</h1>
      <div class="header-sub">Munich Flavour Onboarding</div>
    </div>
    <button class="logout-btn" onclick="logout()">Abmelden</button>
  </header>

  <main>
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('employees')" id="tab-employees">Mitarbeiter</button>
      <button class="tab-btn" onclick="showTab('checklist')" id="tab-checklist">Checkliste</button>
      <button class="tab-btn" onclick="showTab('documents')" id="tab-documents">Dokumente</button>
    </div>

    <!-- ===== EMPLOYEES TAB ===== -->
    <div id="view-employees">
      <div id="empListView">
        <div class="card-header" style="margin-bottom:12px;">
          <span class="section-title" style="margin:0;">Alle Mitarbeiter</span>
          <button class="btn btn-primary btn-sm" onclick="openNewEmployeeModal()">+ Neu</button>
        </div>
        <div class="card" style="padding:0;overflow:hidden;">
          <div style="padding:40px;text-align:center;" id="empLoading">
            <span class="spinner" style="border-color:rgba(0,0,0,0.2);border-top-color:#000;"></span>
          </div>
          <div id="employeeList"></div>
        </div>
      </div>
      <div id="empDetailView" class="hidden">
        <button class="back-btn" onclick="showEmployeeList()">← Zurück</button>
        <div id="empDetailContent"></div>
      </div>
    </div>

    <!-- ===== CHECKLIST TAB ===== -->
    <div id="view-checklist" class="hidden">
      <div class="card-header" style="margin-bottom:12px;">
        <span class="section-title" style="margin:0;">Onboarding-Aufgaben</span>
        <button class="btn btn-primary btn-sm" onclick="openItemModal()">+ Neu</button>
      </div>
      <div id="checklistEditorList"></div>
      <p style="font-size:13px;color:#888;margin-top:8px;">Aufgaben per Drag &amp; Drop sortieren.</p>
    </div>

    <!-- ===== DOCUMENTS TAB ===== -->
    <div id="view-documents" class="hidden">
      <div class="card-header" style="margin-bottom:12px;">
        <span class="section-title" style="margin:0;">Dokumente</span>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-secondary btn-sm" onclick="openFolderModal(null)">+ Ordner</button>
          <button class="btn btn-primary btn-sm" onclick="openUploadModal(null)">+ Datei</button>
        </div>
      </div>
      <div id="docTree"></div>
    </div>
  </main>

  <!-- New Employee Modal -->
  <div id="newEmpModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">Neuer Mitarbeiter</div>
      <div class="form-group"><label>Vollständiger Name</label><input type="text" id="newName" autocomplete="off"></div>
      <div class="form-group"><label>Benutzername</label><input type="text" id="newUsername" autocomplete="off" autocapitalize="none"></div>
      <div class="form-group"><label>Passwort</label><input type="password" id="newPassword" autocomplete="new-password"></div>
      <div class="form-group"><label>Startdatum</label><input type="date" id="newStartDate"></div>
      <div id="newEmpError" class="alert alert-error hidden"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" style="flex:1" onclick="closeNewEmployeeModal()">Abbrechen</button>
        <button class="btn btn-primary" style="flex:1" onclick="createEmployee()">Erstellen</button>
      </div>
    </div>
  </div>

  <!-- Checklist Item Modal -->
  <div id="itemModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title" id="itemModalTitle">Aufgabe hinzufügen</div>
      <div class="form-group"><label>Titel</label><input type="text" id="itemTitle" autocomplete="off"></div>
      <div class="form-group"><label>Beschreibung (optional)</label><textarea id="itemDesc" rows="3"></textarea></div>
      <div id="itemError" class="alert alert-error hidden"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" style="flex:1" onclick="closeItemModal()">Abbrechen</button>
        <button class="btn btn-primary" style="flex:1" onclick="saveItem()">Speichern</button>
      </div>
    </div>
  </div>

  <!-- Folder Modal -->
  <div id="folderModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title" id="folderModalTitle">Neuer Ordner</div>
      <div class="form-group"><label>Ordnername</label><input type="text" id="folderName" autocomplete="off"></div>
      <div id="folderError" class="alert alert-error hidden"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" style="flex:1" onclick="closeFolderModal()">Abbrechen</button>
        <button class="btn btn-primary" style="flex:1" onclick="saveFolder()">Speichern</button>
      </div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="uploadModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">Dokument hochladen</div>
      <div class="form-group">
        <label>Ordner</label>
        <select id="uploadFolderSelect"></select>
      </div>
      <div class="form-group">
        <label>Beschreibung (optional)</label>
        <input type="text" id="uploadDesc" autocomplete="off">
      </div>
      <div class="upload-zone" id="adminUploadZone" onclick="document.getElementById('adminFileInput').click()">
        <div style="font-size:32px;">📄</div>
        <p>Hier klicken oder Datei hineinziehen</p>
        <p id="adminFileName" style="font-weight:600;color:#000;"></p>
      </div>
      <input type="file" id="adminFileInput" style="display:none" onchange="onAdminFileSelected(this)">
      <div id="uploadError" class="alert alert-error hidden"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" style="flex:1" onclick="closeUploadModal()">Abbrechen</button>
        <button class="btn btn-primary" style="flex:1" id="uploadConfirmBtn" onclick="uploadDocument()">Hochladen</button>
      </div>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
