<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MF Portal – Admin</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/logo.jpg">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .folder-node { margin-bottom: 4px; }
    /* Zwei feste Zeilen (Name / Aktionen), damit jede Ordnerzeile gleich aussieht,
       egal wie lang der Name ist. */
    .folder-header { display:flex;flex-direction:column;gap:8px;padding:12px 14px;background:var(--white);border:1.5px solid var(--gray-mid);border-radius:8px;cursor:pointer;transition:background 0.15s; }
    .folder-header:hover { background:var(--gray-light); }
    .folder-top { display:flex;align-items:center;gap:8px; }
    .folder-name { flex:1;font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .folder-actions { display:flex;gap:6px;justify-content:flex-end; }
    .folder-actions .btn { padding:8px 10px; }
    .folder-children { margin-left:24px;margin-top:4px; }

    /* Dokumentzeile: fixes Grundgerüst (Icon | Text | Löschen), damit nichts je nach
       Dateiname/Beschreibung unterschiedlich umbricht. Text wird per Ellipsis gekürzt. */
    .doc-row { display:flex;align-items:stretch;gap:8px;margin-bottom:6px; }
    .doc-item {
      flex:1;min-width:0;display:flex;align-items:center;gap:10px;
      padding:10px 12px;background:var(--white);border:1px solid var(--gray-mid);border-radius:8px;
      text-decoration:none;color:inherit;cursor:pointer;
    }
    .doc-item:active { background:var(--gray-light); }
    .doc-icon { font-size:20px;flex-shrink:0; }
    .doc-info { flex:1;min-width:0;display:flex;flex-direction:column; }
    .doc-name { font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .doc-desc { font-size:12px;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .doc-date { font-size:11px;color:#aaa;margin-top:1px; }
    .doc-delete { flex-shrink:0;align-self:center; }
    .upload-zone { border:2px dashed var(--gray-mid);border-radius:8px;padding:24px;text-align:center;cursor:pointer;transition:border-color 0.2s;margin-top:12px; }
    .upload-zone:hover,.upload-zone.dragover { border-color:var(--black); }
    .upload-zone p { color:var(--gray-dark);font-size:14px;margin-top:8px; }

    .search-bar {
      display: flex;
      align-items: center;
      background: var(--white);
      border: 1.5px solid var(--gray-mid);
      border-radius: 12px;
      padding: 0 14px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .search-bar input {
      border: none;
      box-shadow: none;
      padding: 14px 10px;
      font-size: 16px;
      flex: 1;
      background: transparent;
    }
    .search-bar input:focus { border: none; outline: none; }
    .search-icon { font-size: 18px; color: #aaa; flex-shrink: 0; }
    .search-clear { font-size: 18px; color: #aaa; cursor: pointer; flex-shrink: 0; padding: 4px; }
  </style>
</head>
<body>
  <header>
    <img src="/assets/logo.jpg" alt="Munich Flavour" onerror="this.style.display='none'">
    <div class="header-title"><h1>MF Portal</h1><div class="header-sub">Admin</div></div>
    <button id="pushBtn" onclick="togglePush()" style="background:none;border:1.5px solid rgba(255,255,255,0.3);border-radius:8px;color:#fff;font-size:20px;padding:6px 10px;cursor:pointer;margin-right:6px;display:none;" title="Benachrichtigungen">🔔</button>
    <button class="logout-btn" onclick="logout()">Abmelden</button>
  </header>

  <main>
    <div id="offlineBanner" class="offline-banner hidden">📡 Offline – Änderungen sind erst nach Verbindung wieder möglich.</div>

    <div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;gap:12px;">
      <div>
        <div style="font-weight:600;font-size:14px;">🔔 Push-Benachrichtigungen an Mitarbeiter</div>
        <div style="font-size:12px;color:var(--gray-dark);" id="pushToggleStatus">Lädt…</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="pushToggleInput" onchange="togglePushSetting(this.checked)">
        <span class="switch-slider"></span>
      </label>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('documents')" id="tab-documents">Dokumente</button>
      <button class="tab-btn" onclick="showTab('employees')" id="tab-employees">Mitarbeiter</button>
      <button class="tab-btn" onclick="showTab('announcements')" id="tab-announcements">Ankündigungen</button>
    </div>

    <!-- DOKUMENTE -->
    <div id="view-documents">
      <div class="card-header" style="margin-bottom:12px;">
        <span class="section-title" style="margin:0;">Dokumente</span>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-secondary btn-sm" onclick="openFolderModal(null)">+ Ordner</button>
          <button class="btn btn-primary btn-sm" onclick="openUploadModal(null)">+ Datei</button>
        </div>
      </div>
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="search" id="adminSearchInput" placeholder="Dokument suchen…" oninput="onAdminSearch(this.value)" autocomplete="off">
        <span class="search-clear hidden" id="adminSearchClear" onclick="clearAdminSearch()">✕</span>
      </div>
      <div id="docTree" class="card" style="padding:16px;"></div>
      <div id="adminSearchResults" class="card hidden" style="padding:16px;"></div>
    </div>

    <!-- MITARBEITER -->
    <div id="view-employees" class="hidden">
      <div class="card-header" style="margin-bottom:12px;">
        <span class="section-title" style="margin:0;">Mitarbeiter</span>
        <button class="btn btn-primary btn-sm" onclick="openNewEmpModal()">+ Neu</button>
      </div>
      <div class="card" style="padding:0;overflow:hidden;">
        <div id="empLoading" style="padding:40px;text-align:center;"><span class="spinner" style="border-color:rgba(0,0,0,0.2);border-top-color:#000;"></span></div>
        <div id="employeeList"></div>
      </div>
    </div>

    <!-- ANKÜNDIGUNGEN -->
    <div id="view-announcements" class="hidden">
      <div class="card-header" style="margin-bottom:12px;">
        <span class="section-title" style="margin:0;">Ankündigungen</span>
      </div>
      <div class="card">
        <div class="form-group"><label>Titel</label><input type="text" id="annTitle" autocomplete="off"></div>
        <div class="form-group"><label>Text (optional)</label><textarea id="annBody"></textarea></div>
        <div id="annError" class="alert alert-error hidden"></div>
        <button class="btn btn-primary btn-full" onclick="createAnnouncement()">Veröffentlichen</button>
      </div>
      <div id="announcementAdminList"></div>
    </div>
  </main>

  <!-- New Employee Modal -->
  <div id="newEmpModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">Neuer Mitarbeiter</div>
      <div class="form-group"><label>Vollständiger Name</label><input type="text" id="newName" autocomplete="off"></div>
      <div class="form-group"><label>Benutzername</label><input type="text" id="newUsername" autocomplete="off" autocapitalize="none"></div>
      <div class="form-group"><label>Passwort</label><input type="password" id="newPassword" autocomplete="new-password"></div>
      <div id="newEmpError" class="alert alert-error hidden"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" style="flex:1" onclick="closeNewEmpModal()">Abbrechen</button>
        <button class="btn btn-primary" style="flex:1" onclick="createEmployee()">Erstellen</button>
      </div>
    </div>
  </div>

  <!-- Edit Employee Modal -->
  <div id="editEmpModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">Mitarbeiter bearbeiten</div>
      <div class="form-group"><label>Vollständiger Name</label><input type="text" id="editName" autocomplete="off"></div>
      <div class="form-group"><label>Neues Passwort (leer lassen = unverändert)</label><input type="password" id="editPassword" autocomplete="new-password" placeholder="Leer lassen für keine Änderung"></div>
      <div id="editEmpError" class="alert alert-error hidden"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" style="flex:1" onclick="closeEditEmpModal()">Abbrechen</button>
        <button class="btn btn-primary" style="flex:1" onclick="saveEmployee()">Speichern</button>
      </div>
    </div>
  </div>

  <!-- Folder Modal -->
  <div id="folderModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title" id="folderModalTitle">Neuer Ordner</div>
      <div class="form-group"><label>Ordnername</label><input type="text" id="folderName" autocomplete="off"></div>
      <div id="folderError" class="alert alert-error hidden"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" style="flex:1" onclick="closeFolderModal()">Abbrechen</button>
        <button class="btn btn-primary" style="flex:1" onclick="saveFolder()">Speichern</button>
      </div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="uploadModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">Dokumente hochladen</div>
      <div class="form-group"><label>Ordner</label><select id="uploadFolderSelect"></select></div>
      <div class="form-group"><label>Beschreibung (optional, gilt für alle ausgewählten Dateien)</label><input type="text" id="uploadDesc" autocomplete="off"></div>
      <div class="upload-zone" id="adminUploadZone" onclick="document.getElementById('adminFileInput').click()">
        <div style="font-size:32px;">📤</div>
        <p>Hier klicken oder Dateien hineinziehen (auch mehrere)</p>
        <div id="adminFileName" style="font-weight:600;color:#000;margin-top:4px;font-size:13px;"></div>
      </div>
      <input type="file" id="adminFileInput" multiple style="display:none" onchange="onFileSelected(this)">
      <div id="uploadError" class="alert alert-error hidden"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" style="flex:1" onclick="closeUploadModal()">Abbrechen</button>
        <button class="btn btn-primary" style="flex:1" id="uploadConfirmBtn" onclick="uploadDocument()">Hochladen</button>
      </div>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
