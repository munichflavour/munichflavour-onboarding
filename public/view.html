<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dokument – MF Portal</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/logo.jpg">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    .view-header {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .view-back {
      display: flex; align-items: center; gap: 6px;
      background: none; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer;
      padding: 8px 14px; min-height: 44px; flex-shrink: 0; white-space: nowrap;
    }
    .view-back:active { background: var(--surface-2); }
    .view-title {
      font-size: 15px; font-weight: 600; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0;
    }
    .view-main {
      flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
      margin: 0; padding: 0; max-width: none; width: 100%;
    }
    .view-media { display: flex; align-items: center; justify-content: center; min-height: 100%; padding: 16px; box-sizing: border-box; }
    .view-media img, .view-media video { max-width: 100%; max-height: 100%; border-radius: var(--radius-sm); }
    .view-media audio { width: 100%; max-width: 420px; }
    .view-fallback {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100%; gap: 16px; color: var(--text-secondary); text-align: center; padding: 24px; box-sizing: border-box;
    }
    .view-loading { display: flex; align-items: center; justify-content: center; min-height: 100%; }
    .pdf-pages { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px; box-sizing: border-box; }
    .pdf-page-canvas { max-width: 100%; height: auto; border-radius: var(--radius-sm); background: #fff; box-shadow: 0 2px 14px rgba(0,0,0,0.4); }
  </style>
</head>
<body>
  <header class="view-header">
    <button class="view-back" id="backBtn">← Zurück</button>
    <div class="view-title" id="viewTitle">Dokument</div>
  </header>
  <main class="view-main" id="viewMain"></main>

  <script type="module" src="/js/view.js"></script>
</body>
</html>
