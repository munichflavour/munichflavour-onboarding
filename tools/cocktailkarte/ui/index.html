<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kartengenerator</title>
<style>
@font-face{font-family:Pinsel;src:url(/schrift.ttf)}
:root{--ink:#232220;--muted:#6f6b64;--line:#dedbd4;--bg:#fff;--soft:#f4f2ee;--warn:#fff4d6;--warnb:#e5c36a;--err:#b3261e;--ok:#1d6b3a;--okbg:#e8f5ec}
@media (prefers-color-scheme:dark){:root{--ink:#f1eee8;--muted:#a39e94;--line:#3a3834;--bg:#171614;--soft:#22211e;--warn:#3a3118;--warnb:#7a6428;--err:#ff8a80;--ok:#7fd69a;--okbg:#17301f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
main{max-width:1180px;margin:0 auto;padding:36px 24px 80px}
h1{font-family:Pinsel,sans-serif;font-weight:400;font-size:46px;letter-spacing:.06em;margin:0;line-height:1.1}
.sub{color:var(--muted);margin:6px 0 24px;letter-spacing:.04em}
form{display:flex;gap:10px;max-width:920px}
input[type=text],input:not([type]),select{font:inherit;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#q{flex:1;padding:14px 16px;border-radius:10px}
input:focus,select:focus{outline:2px solid var(--ink);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:12px 20px;font-weight:600}
button.zweit{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500;padding:9px 14px}
button.klein{padding:3px 8px;border-radius:6px;font-size:13px;font-weight:500;background:transparent;color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.5;cursor:default}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:30px 0 10px;font-weight:600}
.liste{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:8px 14px;font-weight:400;border-radius:999px;font-size:14px}
.chip small{color:var(--muted);margin-left:6px}
.treffer{display:flex;flex-direction:column;gap:8px;max-width:920px}
.treffer button{display:flex;justify-content:space-between;gap:16px;text-align:left;background:var(--soft);color:var(--ink);border-color:var(--line);font-weight:400}
.treffer small{color:var(--muted);white-space:nowrap}
.status{margin:20px 0 0;color:var(--muted)}
.fehler{margin:20px 0 0;color:var(--err);font-weight:600}
.stand{margin:14px 0 0;font-size:13px;color:var(--muted)}
.stand button{padding:2px 8px;font-size:12px;border-radius:6px;margin-left:8px}
.leiste{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 6px}
/* Karte = Editor + Vorschau */
.karte{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--soft);margin-top:18px}
.kopf{display:flex;align-items:baseline;gap:12px}
.kopf h3{margin:0;font-size:20px}.anz{color:var(--muted);font-size:14px}
.spalten{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;margin-top:12px}
@media (max-width:900px){.spalten{grid-template-columns:1fr}}
.editor h4{margin:14px 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.editor h4 input{flex:0 1 220px;text-transform:uppercase;font-size:13px;padding:4px 8px}
.zeile{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.zeile.aus input:not([data-f=aktiv]):not([data-f=merken]),.zeile.aus select{opacity:.45}
.zeile .name{flex:1 1 150px;font-weight:600}
.zeile .zut,.zeile .besch{flex:2 1 200px}
.zeile .all{width:78px}
.zeile select{width:64px}
.mini{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:3px}
.pfeile{display:flex;gap:3px}
.badge{font-size:11px;border-radius:999px;padding:1px 8px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.badge.neu{border-color:var(--warnb);background:var(--warn);color:var(--ink)}
.badge.stamm{border-color:var(--ok);color:var(--ok)}
.plus{margin-top:8px}
.vorschau img{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;display:block;min-height:120px}
.vs{font-size:12px;color:var(--muted);min-height:18px;margin-top:4px}
.vs.err{color:var(--err);font-weight:600}
.aktion{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ok{margin-top:10px;padding:9px 11px;border-radius:8px;background:var(--okbg);border:1px solid var(--ok);font-size:13px;word-break:break-all}
.warn{margin-top:10px;padding:9px 12px;border-radius:8px;background:var(--warn);border:1px solid var(--warnb);font-size:13px}
.warn b{display:block;margin-bottom:2px}.warn ul{margin:4px 0 0;padding-left:18px}
.schritt{margin-top:22px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-size:14px;max-width:920px}
.leer{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>MUNICH FLAVOUR</h1>
  <p class="sub">Kartengenerator &middot; Daten direkt aus Rentman</p>

  <form id="form">
    <input id="q" autocomplete="off" autofocus placeholder="Name oder Nummer eines bestätigten Projekts, z. B. Böttcher">
    <button id="los">Karten laden</button>
  </form>
  <div class="stand" id="stand"></div>

  <div id="meldung"></div>
  <div id="auswahl"></div>
  <div id="ergebnis"></div>

  <h2 id="bald-titel" hidden>Bestätigte Events der nächsten 21 Tage</h2>
  <div id="bald" class="liste"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const datum = d => d ? d.split('-').reverse().join('.') : 'ohne Datum';
const uhr = t => new Date(t * 1000).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const post = (url, body) => api(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });

function status(text, klasse = 'status') { $('meldung').innerHTML = text ? `<p class="${klasse}">${esc(text)}</p>` : ''; }
function sperre(an) { $('los').disabled = an; $('q').disabled = an; }

async function api(url, opts) {
  const r = await fetch(url, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.fehler || 'Unbekannter Fehler');
  return j;
}

/* ---------- Projektliste: Stand + Aktualisieren ---------- */
let standTimer = null;
async function stand() {
  clearTimeout(standTimer);
  try {
    const s = await api('/api/stand');
    $('stand').innerHTML = (s.laedt ? 'Projektliste wird aktualisiert …' :
      s.stand ? `Projektliste: Stand ${uhr(s.stand)} Uhr (${s.anzahl} Projekte)` : '') +
      (s.laedt ? '' : ' <button class="zweit" id="aktu">Aktualisieren</button>') +
      (s.fehler ? ` <span class="fehler">${esc(s.fehler)}</span>` : '');
    if ($('aktu')) $('aktu').onclick = async () => { await post('/api/aktualisieren'); stand(); };
    if (s.laedt) standTimer = setTimeout(stand, 1500); else if (stand.vorher && stand.vorher !== s.stand) bald();
    stand.vorher = s.stand;
  } catch (err) { $('stand').textContent = ''; }
}

async function bald() {
  try {
    const { projekte } = await api('/api/anstehende');
    $('bald-titel').hidden = !projekte.length;
    $('bald').innerHTML = projekte.map(p => `<button class="chip" data-id="${p.id}">${esc(p.name)}<small>${datum(p.datum)}</small></button>`).join('');
    $('bald').querySelectorAll('button').forEach(b => b.onclick = () => laden(projekte.find(p => p.id == b.dataset.id)));
  } catch (err) { status(err.message, 'fehler'); }
}

/* ---------- Suche ---------- */
async function suchen(e) {
  e && e.preventDefault();
  const q = $('q').value.trim();
  if (!q) return;
  $('auswahl').innerHTML = ''; $('ergebnis').innerHTML = ''; Z.projekt = null;
  sperre(true); status('Suche in Rentman …');
  try {
    const { projekte, andere } = await api('/api/suche?q=' + encodeURIComponent(q));
    if (!projekte.length) {
      if (andere.length) {
        status(`Kein bestätigtes Projekt zu „${q}“ gefunden. Es gibt aber: ` + andere.map(p => `${p.name} (${p.status}, ${datum(p.datum)})`).join('; ') + '. Karten gibt es nur für bestätigte Projekte.', 'fehler');
      } else status(`Kein Projekt zu „${q}“ gefunden.`, 'fehler');
      sperre(false); return;
    }
    if (projekte.length === 1) { await laden(projekte[0]); return; }
    status(`${projekte.length} Projekte gefunden – bitte auswählen (das nächste Event steht oben):`);
    $('auswahl').innerHTML = '<div class="treffer">' + projekte.slice(0, 30).map(p =>
      `<button data-id="${p.id}"><span>${esc(p.name)}</span><small>Nr. ${p.nummer} &middot; ${datum(p.datum)}</small></button>`).join('') + '</div>';
    $('auswahl').querySelectorAll('button').forEach(b => b.onclick = () => laden(projekte.find(p => p.id == b.dataset.id)));
  } catch (err) { status(err.message, 'fehler'); }
  sperre(false);
}

/* ---------- Karten: Zustand ---------- */
let Z = { projekt: null, e: [], arten: [] };
const timers = {}, tokens = {};

function eintraege(e) { return e.karte === 'essen' ? e.abschnitte.flatMap(a => a.items) : e.items; }
function sauber(e) { return JSON.parse(JSON.stringify(e, (k, v) => k.startsWith('_') ? undefined : v)); }
function vorbereiten(e) {
  e._v = { png: null, anzahl: '', warn: [], text: 'Vorschau wird erstellt …', err: false }; e._erg = null;
  eintraege(e).forEach(i => { i.merken = i.merken || i.quelle === 'manuell'; if (e.karte === 'essen') i.allergene = Array.isArray(i.allergene) ? i.allergene.join(', ') : (i.allergene || ''); });
  return e;
}

async function laden(p, nur) {
  if (!nur) { $('auswahl').innerHTML = ''; $('ergebnis').innerHTML = ''; }
  sperre(true); status(nur ? 'Erstelle Karte …' : `Lade Material von „${p.name}“ aus Rentman …`);
  try {
    const r = await post('/api/entwurf', { id: p.id, nur });
    Z.projekt = r.projekt; Z.arten = r.arten;
    const neu = r.entwuerfe.map(vorbereiten);
    Z.e = nur ? Z.e.filter(e => e.karte !== nur).concat(neu) : neu;
    status(''); zeige();
    neu.forEach(e => vorschau(Z.e.indexOf(e)));
  } catch (err) { status(err.message, 'fehler'); }
  sperre(false);
}

/* ---------- Darstellung ---------- */
const BADGES = { stamm: ['stamm', 'Stammliste'], rentman: ['neu', 'neu aus Rentman'], standard: ['stamm', 'Standardliste'], manuell: ['neu', 'manuell'] };
const badge = q => BADGES[q] ? `<span class="badge ${BADGES[q][0]}">${BADGES[q][1]}</span>` : '';
const knoepfe = `<span class="pfeile"><button class="klein" data-a="auf" title="nach oben">▲</button><button class="klein" data-a="ab" title="nach unten">▼</button><button class="klein" data-a="weg" title="Eintrag entfernen">✕</button></span>`;
const haken = (f, an, text) => `<label class="mini"><input type="checkbox" data-f="${f}" ${an ? 'checked' : ''}>${text}</label>`;

function zeileGetraenk(it, i, j) {
  return `<div class="zeile ${it.aktiv ? '' : 'aus'}" data-e="${i}" data-i="${j}">
    <input type="checkbox" data-f="aktiv" ${it.aktiv ? 'checked' : ''} title="steht auf der Karte">
    <input class="name" data-f="name" value="${esc(it.name)}" placeholder="Name">
    <input class="zut" data-f="zutaten" value="${esc(it.zutaten)}" placeholder="Zutaten">
    ${haken('alkoholfrei', it.alkoholfrei, 'alkoholfrei')}${knoepfe}${haken('merken', it.merken, 'merken')}${badge(it.quelle)}</div>`;
}
function zeileKaffee(it, i, j) {
  return `<div class="zeile ${it.aktiv ? '' : 'aus'}" data-e="${i}" data-i="${j}">
    <input type="checkbox" data-f="aktiv" ${it.aktiv ? 'checked' : ''} title="steht auf der Karte">
    <input class="name" data-f="name" value="${esc(it.name)}" placeholder="Name">
    <input class="zut" data-f="zusatz" value="${esc(it.zusatz)}" placeholder="Zusatzzeile (optional)">
    ${knoepfe}${badge(it.quelle)}</div>`;
}
function zeileSpeise(it, i, s, j) {
  const sel = v => `<option value="${v}" ${it.ernaehrung === v ? 'selected' : ''}>${v || '–'}</option>`;
  return `<div class="zeile ${it.aktiv ? '' : 'aus'}" data-e="${i}" data-s="${s}" data-i="${j}">
    <input type="checkbox" data-f="aktiv" ${it.aktiv ? 'checked' : ''} title="steht auf der Karte">
    <input class="name" data-f="name" value="${esc(it.name)}" placeholder="Name">
    <input class="besch" data-f="beschreibung" value="${esc(it.beschreibung)}" placeholder="Beschreibung">
    <input class="all" data-f="allergene" value="${esc(it.allergene)}" placeholder="Allergene" title="Buchstaben laut Legende, z. B. C, M">
    <select data-f="ernaehrung" title="vegetarisch (V) / vegan (VG)">${sel('')}${sel('V')}${sel('VG')}</select>
    ${knoepfe}${haken('merken', it.merken, 'merken')}${badge(it.quelle)}</div>`;
}

function editor(e, i) {
  if (e.karte === 'essen') {
    return e.abschnitte.map((a, s) => `<h4>${esc(a.titel)}</h4>` + a.items.map((it, j) => zeileSpeise(it, i, s, j)).join('') +
      `<div class="plus"><button class="klein" data-a="plus" data-e="${i}" data-s="${s}">+ Eintrag</button></div>`).join('');
  }
  if (e.karte === 'kaffee') {
    return `<h4>Beschriftung <input data-f="label" data-e="${i}" value="${esc(e.label)}"></h4>` +
      e.items.map((it, j) => zeileKaffee(it, i, j)).join('') +
      `<div class="plus"><button class="klein" data-a="plus" data-e="${i}">+ Eintrag</button></div>`;
  }
  const teil = frei => e.items.map((it, j) => !!it.alkoholfrei === frei ? zeileGetraenk(it, i, j) : '').join('');
  return `<h4>Beschriftung <input data-f="label" data-e="${i}" value="${esc(e.label)}"></h4>${teil(false)}
    <div class="plus"><button class="klein" data-a="plus" data-e="${i}" data-frei="0">+ Eintrag</button></div>
    <h4>Zweite Abteilung <input data-f="label2" data-e="${i}" value="${esc(e.label2)}"> <span class="mini">(alkoholfreie Drinks)</span></h4>${teil(true)}
    <div class="plus"><button class="klein" data-a="plus" data-e="${i}" data-frei="1">+ Eintrag</button></div>`;
}

function warnHtml(e) {
  const alle = [...new Set([...(e.warnungen || []), ...e._v.warn])];
  return alle.length ? `<div class="warn"><b>Bitte prüfen</b><ul>${alle.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : '';
}
function ergHtml(e) {
  if (!e._erg) return '';
  const g = e._erg;
  return (g.pfad ? `<div class="ok"><b>Gespeichert:</b> ${esc(g.pfad)}${g.gemerkt ? `<br>${g.gemerkt} Eintrag/Einträge in die Stammliste gemerkt.` : ''}</div>
    <div class="aktion"><a href="${g.url}" download="${esc(e.datei)}"><button class="zweit">PDF herunterladen</button></a>
    <button class="zweit" data-a="zeigen" data-pfad="${esc(g.pfad)}">Im Finder zeigen</button></div>` :
    `<div class="aktion"><a href="${g.url}" download="${esc(e.datei)}"><button class="zweit">PDF herunterladen</button></a></div>`) +
    (g.fehler ? `<p class="fehler">${esc(g.fehler)}</p>` : '');
}

function panel(e, i) {
  return `<section class="karte" data-e="${i}">
    <div class="kopf"><h3>${esc(e.titel)}</h3><span class="anz" id="anz${i}">${esc(e._v.anzahl)}</span></div>
    <div id="warn${i}">${warnHtml(e)}</div>
    <div class="spalten"><div class="editor">${editor(e, i)}</div>
      <div class="vorschau"><img id="img${i}" alt="Vorschau ${esc(e.titel)}"><div class="vs" id="vs${i}"></div>
        <div class="aktion"><button data-a="speichern" data-e="${i}">PDF speichern</button></div>
        <div id="erg${i}">${ergHtml(e)}</div></div></div></section>`;
}

function zeige() {
  const p = Z.projekt; if (!p) return;
  const kopf = `${esc(p.name)} <span class="leer">&middot; Nr. ${p.nummer} &middot; ${datum(p.datum)}</span>`;
  const fehlend = Z.arten.filter(a => !Z.e.some(e => e.karte === a.karte));
  let h = `<h2>${kopf}</h2>`;
  if (!Z.e.length) h += '<p class="leer">In diesem Projekt ist weder Getränke-, Kaffee- noch Catering-Material gebucht, daher wurde keine Karte erzeugt.</p>';
  else h += `<div class="leiste"><button data-a="alle">Alle Karten speichern</button><button class="zweit" data-a="neu">Neu aus Rentman laden</button></div>` +
    Z.e.map(panel).join('') +
    `<div class="schritt"><b>Nächster Schritt:</b> Gespeicherte Karten in Rentman im Projekt „${esc(p.name)}“ (Nr. ${p.nummer}) unter <i>Dateien</i> hochladen. Die Rentman-API erlaubt keinen automatischen Upload.</div>`;
  if (fehlend.length) h += `<h2>Weitere Karte erstellen</h2><div class="liste">` + fehlend.map(a => `<button class="chip" data-a="zusatz" data-art="${a.karte}">${esc(a.titel)}</button>`).join('') + '</div>';
  $('ergebnis').innerHTML = h;
  Z.e.forEach((e, i) => zeigeVs(i));
}

function zeigeVs(i) {
  const e = Z.e[i]; if (!e || !$('img' + i)) return;
  if (e._v.png) $('img' + i).src = 'data:image/png;base64,' + e._v.png;
  $('vs' + i).textContent = e._v.text || ''; $('vs' + i).className = 'vs' + (e._v.err ? ' err' : '');
  $('anz' + i).textContent = e._v.anzahl || ''; $('warn' + i).innerHTML = warnHtml(e);
}

/* ---------- Vorschau + Speichern ---------- */
function plane(i) {
  const e = Z.e[i]; e._v.text = 'Vorschau wird aktualisiert …'; e._v.err = false; zeigeVs(i);
  clearTimeout(timers[i]); timers[i] = setTimeout(() => vorschau(i), 600);
}
async function vorschau(i) {
  const e = Z.e[i]; if (!e) return;
  const t = tokens[i] = (tokens[i] || 0) + 1;
  try {
    const r = await post('/api/vorschau', { entwurf: sauber(e) });
    if (t !== tokens[i]) return;
    e._v = { png: r.png, anzahl: r.anzahl, warn: r.warnungen, text: '', err: false };
  } catch (err) { if (t !== tokens[i]) return; e._v.text = err.message; e._v.err = true; }
  zeigeVs(i);
}
function blobUrl(b64) {
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
  return URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
}
async function speichern(i) {
  const e = Z.e[i]; clearTimeout(timers[i]); tokens[i] = (tokens[i] || 0) + 1;
  try {
    const r = await post('/api/erzeugen', { id: Z.projekt.id, entwurf: sauber(e) });
    e._erg = { pfad: r.pfad, url: blobUrl(r.pdf), gemerkt: r.gemerkt, fehler: r.speicherfehler };
    e._v = { png: r.png, anzahl: r.anzahl, warn: r.warnungen, text: '', err: false };
    eintraege(e).forEach(it => { if (it.merken) { it.merken = false; it.quelle = it.quelle === 'standard' ? 'standard' : 'stamm'; } });
    const y = window.scrollY; zeige(); window.scrollTo(0, y);
  } catch (err) { e._v.text = err.message; e._v.err = true; zeigeVs(i); throw err; }
}

/* ---------- Bearbeiten (Ereignisse) ---------- */
function zeileInfo(el) {
  const z = el.closest('.zeile'); if (!z) return null;
  const e = Z.e[+z.dataset.e];
  const liste = e.karte === 'essen' ? e.abschnitte[+z.dataset.s].items : e.items;
  return { e, i: +z.dataset.e, liste, j: +z.dataset.i, z };
}
const TEXTFELDER = ['name', 'zutaten', 'zusatz', 'beschreibung', 'allergene', 'ernaehrung', 'alkoholfrei'];

function aenderung(ev) {
  const f = ev.target.dataset.f; if (!f) return;
  const info = zeileInfo(ev.target);
  if (!info) {                                   // Beschriftung (label/label2) der Karte
    const e = Z.e[+ev.target.dataset.e]; e[f] = ev.target.value; plane(+ev.target.dataset.e); return;
  }
  const it = info.liste[info.j];
  it[f] = ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value;
  if (TEXTFELDER.includes(f) && f !== 'alkoholfrei' && info.e.karte !== 'kaffee' && !it.merken) {   // geaendert -> fuer die Stammliste vormerken
    it.merken = true; const m = info.z.querySelector('[data-f=merken]'); if (m) m.checked = true;
  }
  if (f === 'aktiv') info.z.classList.toggle('aus', !it.aktiv);
  if (f === 'alkoholfrei') { const y = window.scrollY; zeige(); window.scrollTo(0, y); }
  plane(info.i);
}

function bewege(info, richtung) {
