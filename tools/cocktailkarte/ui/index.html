<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kartengenerator</title>
<style>
@font-face{font-family:Pinsel;src:url(/schrift.ttf)}
:root{--ink:#232220;--muted:#6f6b64;--line:#dedbd4;--bg:#fff;--soft:#f4f2ee;--warn:#fff4d6;--warnb:#e5c36a;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--ink:#f1eee8;--muted:#a39e94;--line:#3a3834;--bg:#171614;--soft:#22211e;--warn:#3a3118;--warnb:#7a6428;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
main{max-width:920px;margin:0 auto;padding:40px 24px 80px}
h1{font-family:Pinsel,sans-serif;font-weight:400;font-size:46px;letter-spacing:.06em;margin:0;line-height:1.1}
.sub{color:var(--muted);margin:6px 0 28px;letter-spacing:.04em}
form{display:flex;gap:10px}
input{flex:1;min-width:0;font:inherit;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--ink);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:14px 22px;font-weight:600}
button.zweit{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500;padding:10px 16px}
button:disabled{opacity:.5;cursor:default}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:34px 0 10px;font-weight:600}
.liste{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:8px 14px;font-weight:400;border-radius:999px;font-size:14px}
.chip small{color:var(--muted);margin-left:6px}
.treffer{display:flex;flex-direction:column;gap:8px}
.treffer button{display:flex;justify-content:space-between;gap:16px;text-align:left;background:var(--soft);color:var(--ink);border-color:var(--line);font-weight:400}
.treffer small{color:var(--muted);white-space:nowrap}
.status{margin:22px 0 0;color:var(--muted)}
.fehler{margin:22px 0 0;color:var(--err);font-weight:600}
.karten{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;margin-top:10px}
.karte{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--soft)}
.karte h3{margin:0;font-size:20px}
.karte .anz{color:var(--muted);margin:2px 0 14px}
.karte img{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;display:block}
.karte .aktion{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.karte a{text-decoration:none}
.warn{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--warn);border:1px solid var(--warnb);font-size:14px}
.warn b{display:block;margin-bottom:2px}.warn ul{margin:4px 0 0;padding-left:18px}
.leer{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>MUNICH FLAVOUR</h1>
  <p class="sub">Kartengenerator &middot; Daten direkt aus Rentman</p>

  <form id="form">
    <input id="q" autocomplete="off" autofocus placeholder="Name oder Nummer eines bestätigten Projekts, z. B. Böttcher">
    <button id="los">Karte erstellen</button>
  </form>

  <div id="meldung"></div>
  <div id="auswahl"></div>
  <div id="ergebnis"></div>

  <h2 id="bald-titel" hidden>Bestätigte Events der nächsten 21 Tage</h2>
  <div id="bald" class="liste"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const datum = d => d ? d.split('-').reverse().join('.') : 'ohne Datum';

function status(text, klasse = 'status') { $('meldung').innerHTML = text ? `<p class="${klasse}">${esc(text)}</p>` : ''; }
function sperre(an) { $('los').disabled = an; $('q').disabled = an; }

async function api(url, opts) {
  const r = await fetch(url, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.fehler || 'Unbekannter Fehler');
  return j;
}

async function suchen(e) {
  e && e.preventDefault();
  const q = $('q').value.trim();
  if (!q) return;
  $('auswahl').innerHTML = ''; $('ergebnis').innerHTML = '';
  sperre(true); status('Suche in Rentman …');
  try {
    const { projekte, andere } = await api('/api/suche?q=' + encodeURIComponent(q));
    if (!projekte.length) {
      if (andere.length) {
        status(`Kein bestätigtes Projekt zu „${q}“ gefunden. Es gibt aber: ` + andere.map(p => `${p.name} (${p.status}, ${datum(p.datum)})`).join('; ') + '. Karten gibt es nur für bestätigte Projekte.', 'fehler');
      } else status(`Kein Projekt zu „${q}“ gefunden.`, 'fehler');
      sperre(false); return;
    }
    if (projekte.length === 1) { await erzeugen(projekte[0]); return; }
    status(`${projekte.length} Projekte gefunden – bitte auswählen (das nächste Event steht oben):`);
    $('auswahl').innerHTML = '<div class="treffer">' + projekte.slice(0, 30).map(p =>
      `<button data-id="${p.id}"><span>${esc(p.name)}</span><small>Nr. ${p.nummer} &middot; ${datum(p.datum)}</small></button>`).join('') + '</div>';
    $('auswahl').querySelectorAll('button').forEach(b => b.onclick = () => erzeugen(projekte.find(p => p.id == b.dataset.id)));
  } catch (err) { status(err.message, 'fehler'); }
  sperre(false);
}

function blob(b64, typ) {
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([arr], { type: typ }));
}

async function erzeugen(p) {
  $('auswahl').innerHTML = ''; $('ergebnis').innerHTML = '';
  sperre(true); status(`Lade Material von „${p.name}“ aus Rentman und erzeuge Karten …`);
  try {
    const r = await api('/api/karten', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: p.id }) });
    const kopf = `${esc(r.projekt.name)} <span class="leer">&middot; Nr. ${r.projekt.nummer} &middot; ${datum(r.projekt.datum)}</span>`;
    if (!r.karten.length) {
      status('');
      $('ergebnis').innerHTML = `<h2>${kopf}</h2><p class="leer">In diesem Projekt ist weder Cocktail- noch Smoothie-Material gebucht, daher gibt es keine Karte.</p>`;
    } else {
      status('');
      $('ergebnis').innerHTML = `<h2>${kopf}</h2><div class="karten">` + r.karten.map((k, i) => {
        const url = blob(k.pdf, 'application/pdf');
        const warn = k.warnungen.length ? `<div class="warn"><b>Bitte prüfen</b><ul>${k.warnungen.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : '';
        return `<div class="karte"><h3>${esc(k.titel)}</h3><div class="anz">${esc(k.anzahl)}</div>
          <img alt="Vorschau ${esc(k.titel)}" src="data:image/png;base64,${k.png}">
          <div class="aktion"><a href="${url}" download="${esc(k.datei)}"><button>PDF herunterladen</button></a>
          <a href="${url}" target="_blank"><button class="zweit">Im Browser öffnen</button></a></div>${warn}</div>`;
      }).join('') + '</div>';
    }
  } catch (err) { status(err.message, 'fehler'); }
  sperre(false);
}

$('form').addEventListener('submit', suchen);

(async () => {
  try {
    const { projekte } = await api('/api/anstehende');
    if (!projekte.length) return;
    $('bald-titel').hidden = false;
    $('bald').innerHTML = projekte.map(p => `<button class="chip" data-id="${p.id}">${esc(p.name)}<small>${datum(p.datum)}</small></button>`).join('');
    $('bald').querySelectorAll('button').forEach(b => b.onclick = () => erzeugen(projekte.find(p => p.id == b.dataset.id)));
  } catch (err) { status(err.message, 'fehler'); }
})();
</script>
</body>
</html>
