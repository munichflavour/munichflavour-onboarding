<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Catering-Kalkulator</title>
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .toolbar input { flex:1; min-width:160px; }
    .proj { display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--gray-mid); }
    .proj:last-child { border-bottom:none; }
    .proj-name { font-weight:600; }
    .proj-meta { font-size:12px; color:var(--gray-dark); }
    .pill { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; background:var(--gray-mid); }
    .pill.sample { background:#ffe9a8; }
    .note { font-size:13px; color:var(--gray-dark); }
    .warn { background:#fff4d6; border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:12px; }
    pre.diag { background:#111; color:#eee; padding:12px; border-radius:8px; overflow:auto; max-height:420px; font-size:12px; }
  </style>
</head>
<body>
  <header>
    <img src="/assets/logo.jpg" alt="Munich Flavour" onerror="this.style.display='none'">
    <div class="header-title"><h1>Catering-Kalkulator</h1><div class="header-sub">Admin</div></div>
    <a href="/admin.html" style="color:#fff;text-decoration:none;border:1.5px solid rgba(255,255,255,0.3);border-radius:8px;font-size:14px;padding:8px 12px;">Portal</a>
  </header>

  <main>
    <div id="rentmanWarn" class="warn hidden"></div>

    <div class="card">
      <h2 style="font-size:16px;margin-bottom:8px;">Kommende Projekte</h2>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Projektname oder Nummer" autocomplete="off">
        <button class="btn btn-secondary" id="refreshBtn">Mit Rentman abgleichen</button>
      </div>
      <div id="syncInfo" class="note" style="margin-bottom:8px;"></div>
      <div id="projects"><div class="note">Lädt…</div></div>
    </div>

    <div class="card">
      <h2 style="font-size:16px;margin-bottom:8px;">Rentman-Diagnose</h2>
      <p class="note" style="margin-bottom:8px;">Zeigt die Rohdaten eines Projekts (nur lesend), um zu klären, wo Gästezahl, Kunde, Ort und Artikelnummern stehen.</p>
      <div class="toolbar">
        <input id="diagId" type="text" inputmode="numeric" placeholder="Rentman-Projekt-ID">
        <button class="btn btn-secondary" id="diagBtn">Abrufen</button>
      </div>
      <pre id="diagOut" class="diag hidden"></pre>
    </div>
  </main>

  <script src="/catering/app.js"></script>
</body>
</html>
